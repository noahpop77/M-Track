<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
    />
    <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.1.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='classic/style.css') }}?v={{ static_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='classic/items.css') }}?v={{ static_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='classic/summoners.css') }}?v={{ static_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='classic/innerScoreboardChamps.css') }}?v={{ static_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='classic/scoreboardChamps.css') }}?v={{ static_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='classic/champs.css') }}?v={{ static_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='classic/keystones.css') }}?v={{ static_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='classic/runeCategories.css') }}?v={{ static_version }}" />

    <script src="{{ url_for('static', filename='classic/scripts.js') }}?v={{ static_version }}"></script>

    <title>M-Track</title>
  </head>

  <body class="bg-dark">

    <!-- Navbar -->
    <nav style="font-family: VCR OSD Mono, sans-serif" class="bg-dark navbar-dark fixed-top">
      <div class="container" style="min-width: auto !important; max-width: none !important;">
        <div class="navbar-nav" style="flex-direction: row; width: 100%; align-items: center;">
          <a href="/classic" class="nav-link navbar-brand" style="font-size: xx-large;">M-Tracker</a>
          <a href="/" class="nav-link" style="margin-left: auto;" title="Switch to the modern site">AI Assisted Version of M-Track</a>
        </div>
      </div>
    </nav>


    <!-- Search Input -->
    <section class="searchSection text-dark pt-2">
      <div class="container maxWidth">

        <div class="input-group summoner-input searchContainer rounded-3">
          <select style="border-radius: 4px; background-color: #1c1f23; font-family: VCR OSD Mono, sans-serif; font-weight: bold; font-size: 100%; outline: none; box-shadow: none; color: white; width: 10%;" name="region" id="region">
            <option value="eun1">EUN1</option>
            <option value="euw1">EUW1</option>
            <option value="na1" selected>NA1</option>
          </select>
          <input id="nameInput" style="height: 100%; font-family: VCR OSD Mono, sans-serif; outline: none; background: transparent; border: 0px; font-weight:bold; font-size: 120%;" type="text" class="form-control rounded-5 text-center shadow-none" placeholder="Game Name + #Tagline" />

          <button id="searchButton" class="btn btn-dark btn-sm rounded-3" style="font-weight:bold; font-size: 100%; font-family: VCR OSD Mono, sans-serif; outline: none; box-shadow: none;" type="button" onclick="summonerSearch()">TRACK</button>

        </div>

      </div>
    </section>
    <!-- Search Result -->
    <section class="searchSection text-dark pt-2">
      <div class="container" style="min-width: 100%; max-width:none;">
        <div class="align-items-center">
          <h3 id="responseParagraph" class="text-center fw-bold maxWidth" style="font-family: VCR OSD Mono, sans-serif; font-size: 200%; margin-left: auto; margin-right: auto;"></h3>

        </div>
      </div>
    </section>





    <!-- HTML Structure to Display Summoner Rank Data -->
    <div id="player-container" class="center"></div>
    <!-- HTML Structure to Display Data -->
    <div id="data-container" class="accordion center pt-2"></div>



    <div id="formControl" data-key="7"></div>

    <!-- Show More -->
    <div id="showMoreButtonDiv">

    </div>








    <script>
      var input = document.getElementById("nameInput");
      input.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
          event.preventDefault();
          document.getElementById("searchButton").click();
        }
      });
    </script>



    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
      crossorigin="anonymous"
    ></script>


    <!-- Footer -->
    <footer class="p-5 bg-dark text-white text-center position-relative"></footer>

  </body>
</html>
