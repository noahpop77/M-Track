<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c1f23" />
    <meta
      name="description"
      content="M-Track — a lightweight League of Legends Ranked Solo/Duo match history dashboard."
    />

    <title>M-Track — Match History</title>

    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet" />

    <link rel="stylesheet" href="{{ url_for('static', filename='sprites.css') }}?v={{ static_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_version }}" />

    <script src="{{ url_for('static', filename='scripts.js') }}?v={{ static_version }}" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to match history</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/" aria-label="M-Track home">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="10.4" />
            <path class="hourglass-cap" d="M8.7 7.1h6.6M8.7 16.9h6.6" />
            <path class="hourglass-body" d="M9.4 7.1 12 12l2.6-4.9M9.4 16.9 12 12l2.6 4.9" />
          </svg>
          <span>M-TRACK</span>
        </a>

        <form id="searchForm" class="search" role="search" novalidate>
          <span class="select-wrap">
            <label class="sr-only" for="region">Region</label>
            <select id="region" name="region" class="region-select">
              <option value="eun1">EUNE</option>
              <option value="euw1">EUW</option>
              <option value="na1" selected>NA</option>
            </select>
          </span>

          <label class="sr-only" for="nameInput">Riot ID</label>
          <input
            id="nameInput"
            name="nameInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Game Name#Tagline"
            aria-describedby="status"
          />

          <button id="searchButton" class="btn btn-primary" type="submit">
            Track
          </button>
        </form>

        <a class="theme-toggle" href="/classic" title="Switch to the classic site">
          No AI Version of M-Track
        </a>
      </div>
    </header>

    <main id="main" class="shell">
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section
        id="player-container"
        class="player"
        aria-label="Ranked information"
        hidden
      ></section>

      <div id="profile-container" hidden></div>

      <div id="data-container" class="matches"></div>

      <div id="showMoreButtonDiv" class="show-more-wrap"></div>
    </main>

    <footer class="site-footer shell">
      <span>Ranked Solo/Duo match history</span>
      <span>Data from Riot Games</span>
    </footer>
  </body>
</html>
